<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>مساحة الدراسة</title>
<style>
:root{--bg:#05100f;--tx:#eaf4f1;--mut:#93aaa5;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--a:#2dd4bf;--b:#fbbf24;--c:#fb7185;--d:#7dd3fc;--ok:#34d399;--bad:#fb7185;--grad:linear-gradient(100deg,#5eead4,#fde68a 52%,#fda4af);--ease:cubic-bezier(.2,.8,.2,1);--f:"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.85 var(--f);min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.3;mix-blend-mode:screen;animation:drift 28s ease-in-out infinite alternate}
.aurora i:nth-child(1){top:-24vmax;right:-14vmax;background:radial-gradient(circle,#0d9488,transparent 65%)}
.aurora i:nth-child(2){bottom:-28vmax;left:-16vmax;background:radial-gradient(circle,#b45309,transparent 65%);animation-duration:34s;animation-delay:-9s}
.aurora i:nth-child(3){top:26%;left:34%;width:42vmax;height:42vmax;opacity:.2;background:radial-gradient(circle,#be123c,transparent 65%);animation-duration:40s;animation-delay:-16s}
@keyframes drift{50%{transform:translate(7vw,6vh) scale(1.15) rotate(30deg)}100%{transform:translate(-6vw,9vh) scale(.94) rotate(-20deg)}}
#gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px}
#gate.gone{animation:gout .75s var(--ease) forwards;pointer-events:none}
@keyframes gout{to{opacity:0;transform:scale(1.08);filter:blur(12px)}}
.gc{position:relative;width:min(410px,100%);padding:38px 28px 24px;border-radius:28px;text-align:center;background:linear-gradient(170deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 40px 110px -30px rgba(13,148,136,.55);animation:cin .8s var(--ease) both}
@keyframes cin{from{opacity:0;transform:translateY(22px) scale(.96)}}
.gc.shake{animation:shake .5s}
@keyframes shake{15%,55%,85%{transform:translateX(-9px)}35%,70%{transform:translateX(9px)}}
.orb{position:relative;width:96px;height:96px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(45,212,191,.28),rgba(251,191,36,.14));border:1px solid var(--line2);transition:background .5s,box-shadow .5s;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.orb::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--ok);opacity:0}
.orb svg{width:58px;height:58px;overflow:visible}
.orb .d1{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.orb .d2{fill:var(--b);opacity:.35}
.shk{transform-origin:32.500px 21px;transition:transform .6s cubic-bezier(.4,-.4,.3,1.6)}
.gc.ok .shk{transform:translateY(-5px) rotate(34deg)}
.gc.ok .orb{background:linear-gradient(140deg,rgba(52,211,153,.5),rgba(45,212,191,.2));box-shadow:0 0 70px rgba(52,211,153,.6)}
.gc.ok .orb::after{animation:burst .8s ease-out}
@keyframes burst{from{opacity:1}to{opacity:0;transform:scale(2.1)}}
.gc h1{margin:0 0 4px;font-size:1.5rem;line-height:1.5;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gc p{margin:0 0 20px;color:var(--mut);font-size:.95rem}
.fld{position:relative;margin-bottom:12px}
.fld input{width:100%;height:54px;padding:0 18px;border-radius:16px;border:1px solid var(--line2);background:rgba(0,0,0,.35);outline:none;direction:ltr;text-align:center;letter-spacing:.06em;font-size:16px}
.fld input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(45,212,191,.18)}
.fld button{position:absolute;right:7px;top:7px;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--mut);display:grid;place-items:center}
.fld svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
#go{width:100%;height:54px;border:0;border-radius:16px;font-weight:700;color:#04211d;background:linear-gradient(110deg,#5eead4,#fde68a);transition:transform .2s,opacity .2s}
#go:hover{transform:translateY(-1px)}#go:disabled{opacity:.55;cursor:not-allowed;transform:none}
#msg{min-height:30px;margin:10px 0 0;font-size:.92rem;color:#fda4af}
.gf{margin-top:8px;font-size:.72rem;color:var(--mut);direction:ltr}
#app{position:relative;z-index:1}
#app.enter{animation:ain .9s var(--ease) both}
@keyframes ain{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

  <div class="orb"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="d2" d="M9 21h30v21H9z"/><path class="d1 shk" d="M15.500 21v-6c.1-5.200 3.700-8.700 8.500-8.700s8.500 3.500 8.500 8.700v6"/><path class="d1" d="M9.200 21.300c9.800-.5 19.800-.5 29.600 0 .6 6.900.6 13.800 0 20.700-9.800.5-19.800.5-29.600 0-.6-6.900-.6-13.800 0-20.700zM24 29v5.500"/></svg></div>

   <button id="go" type="submit">فتح</button>
   <div id="msg" role="status" aria-live="polite"></div>
  </form>
